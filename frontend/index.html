<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232573e6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='16 18 22 12 16 6'/><polyline points='8 6 2 12 8 18'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Harshal Patel" />
    <title>CodePrep — Coding &amp; SQL Interview Workbench | Harshal Patel</title>

    <!-- Google Fonts for Design System -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Theme flash prevention bootstrap (supports 6 coding & light themes, defaults to Pitch Black) -->
    <script>
      (function() {
        try {
          var validThemes = ['dark', 'light', 'leetcode', 'vscode', 'tokyo', 'monokai'];
          var storedTheme = localStorage.getItem('codeprep_theme');
          var activeTheme = validThemes.indexOf(storedTheme) !== -1 ? storedTheme : 'dark';
          if (storedTheme === 'auto') {
            localStorage.setItem('codeprep_theme', 'dark');
          }

          var root = document.documentElement;
          root.setAttribute('data-theme', activeTheme);
          if (activeTheme === 'light') {
            root.classList.remove('dark');
            root.classList.add('light');
          } else {
            root.classList.add('dark');
            root.classList.remove('light');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-canvas text-text-primary antialiased font-body min-h-screen selection:bg-primary/20 selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
