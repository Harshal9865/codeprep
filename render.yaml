services:
  - type: web
    name: codeprep
    runtime: docker
    branch: main
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        value: file:/data/codeprep.db
      - key: SECURE_COOKIES
        value: "true"
      - key: SANDBOX_TYPE
        value: local-process
      - key: SANDBOX_TIMEOUT_MS
        value: "2000"
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: MAX_USERS
        value: "100"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
    disk:
      name: codeprep-sqlite-data
      mountPath: /data
      sizeGB: 1

